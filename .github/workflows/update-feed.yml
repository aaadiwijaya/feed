
name: Update FMC Security Intelligence Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-adj-md5
  cancel-in-progress: false

jobs:
  update-checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate feed
        shell: bash
        run: |
          set -euo pipefail

          test -f adj.txt || {
            echo "ERROR: adj.txt tidak ditemukan"
            exit 1
          }

          entries=$(grep -Ev '^[[:space:]]*(#|;|$)' adj.txt | wc -l)

          if [ "$entries" -eq 0 ]; then
            echo "ERROR: Feed kosong, checksum tidak diperbarui"
            exit 1
          fi

          echo "Jumlah baris feed: $entries"

      - name: Generate MD5
        shell: bash
        run: |
          set -euo pipefail
          md5sum adj.txt | awk '{print $1}' > adj.txt.md5
          cat adj.txt.md5

      - name: Commit MD5 checksum
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add adj.txt.md5

          if git diff --cached --quiet; then
            echo "MD5 tidak berubah"
          else
            git commit -m "Update adj.txt MD5 checksum"
            git push
          fi
